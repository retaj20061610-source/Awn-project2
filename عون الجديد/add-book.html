<main class="add-book-page">
<h1>ساهمي بعلمك مع عون 💚</h1>

<p>
    عندك كتاب أو ملزمة؟ شاركيها مع زميلاتك وساعديهن في رحلتهن التعليمية.
</p>
</main>

<form id="bookForm">

    <label for="studentName">اسم الطالبة</label>
    <input type="text" id="studentName" required>

    <label for="phone">رقم التواصل</label>
<input
    type="tel"
    id="phone"
    name="phone"
    placeholder="05xxxxxxxx"
    pattern="05[0-9]{8}"
    maxlength="10"
    required
>
    <label for="bookName">اسم الكتاب أو الملزمة</label>
    <input type="text" id="bookName" required>

    <label for="courseName">اسم المقرر</label>
    <input type="text" id="courseName" required>

    <label for="bookType">نوع المساهمة</label>
    <select id="bookType" required>
        <option value="">اختاري نوع المساهمة</option>
        <option value="electronic">ملف إلكتروني</option>
        <option value="printed">كتاب أو ملزمة مطبوعة للاستعارة</option>
    </select>

    <label for="bookDescription">وصف الكتاب أو الملزمة</label>
    <textarea id="bookDescription" rows="4"
        placeholder="اكتبي وصفًا مختصرًا"></textarea>

    <label for="bookFile">ملف الكتاب (اختياري)</label>
    <input type="file" id="bookFile" accept=".pdf">

    <button type="submit">إضافة للمكتبة</button>

    <p id="formMessage" role="status"></p>

</form>
